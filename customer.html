<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review your experience</title><link rel="stylesheet" href="customer.css"></head><body><main><article><h1 id="biz">Write your review</h1><p id="cat"></p><p>Share your genuine experience in your own words.</p><label>Your experience<textarea id="experience" rows="6" placeholder="What did you actually experience?"></textarea></label><div class="row"><label>Language<select id="language"><option>English</option><option>Hindi</option><option>Hinglish</option></select></label><label>Length<select id="length"><option>Short</option><option selected>Medium</option><option>Detailed</option></select></label></div><button id="generate">Generate draft</button><p id="msg"></p><label>Review draft<textarea id="draft" rows="7"></textarea></label><button id="continue" disabled>Copy draft & continue to Google</button><p class="note">Review and edit the draft. This tool does not post on your behalf. Paste and submit manually on Google.</p></article></main><script src="customer.js"></script></body></html>
